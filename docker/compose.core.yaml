services:
  memgraph:
    image: memgraph/memgraph-mage:3.12.0
    command:
      - "--storage-wal-enabled=true"
      - "--storage-snapshot-on-exit=true"
    volumes:
      - memgraph_data:/var/lib/memgraph
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7444:7444"
    networks:
      - incimin
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  memgraph-lab:
    image: memgraph/lab:2.13.0
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - incimin
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    depends_on:
      memgraph:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - incimin
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "cat /dev/null > /dev/tcp/127.0.0.1/6333"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  memgraph_data:
  qdrant_data:

networks:
  incimin:
