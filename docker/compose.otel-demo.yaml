name: otel-demo

include:
  - otel-demo/compose.yaml

services:
  otel-collector:
    deploy:
      resources:
        limits:
          memory: 400M
    volumes:
      - ./otel-demo/otelcol-config-signoz.yml:/etc/otelcol-config-signoz.yml:ro
    command:
      - --config=/etc/otelcol-config.yml
      - --config=/etc/otelcol-config-extras.yml
      - --config=/etc/otelcol-config-signoz.yml
      - --feature-gates=service.profilesSupport

  load-generator:
    deploy:
      resources:
        limits:
          memory: 512M

  frontend-proxy:
    ports:
      - "127.0.0.1:8090:8090"

networks:
  default:
    name: incimin
    external: true
