# SigNoz v0.135.1 — generated by foundryctl v0.2.17, port-corrected per docs/PORTS.md
# Generated from: docker/signoz/casting.yaml
# Port corrections applied (D-04, T-01-08):
#   - signoz-signoz-0 (frontend+API): 127.0.0.1:3301:8080 (never 8080 on host)
#   - ingester (OTel collector): 127.0.0.1:4317:4317 and 127.0.0.1:4318:4318
#   - clickhouse HTTP: 127.0.0.1:8123:8123 (TCP 9000 not published)
# Image pins:
#   - clickhouse/clickhouse-server:24.8.14.39 (DEVIATION from D-08 24.1.2.5 pin:
#     signoz-otel-collector v0.144.x migration 1006 uses JSON(max_dynamic_paths=100)
#     which requires ClickHouse 24.8+. 24.1.2.5 predates the JSON type. 24.8.14.39
#     is the latest 24.8 LTS patch and remains in the 24.x family SigNoz targets.)
#   - clickhouse/clickhouse-keeper:24.8.14.39 (pinned to match clickhouse-server version)
#   - signoz/signoz:v0.135.1 (replaces :latest)
#   - signoz/signoz-otel-collector:v0.144.7 (replaces :latest; has /signoz-otel-collector migrate subcommands)
#   - postgres:16 (already explicit, retained)
# Network: all services attached to shared incimin network (declared in root compose.yaml)
# Volumes: prefixed signoz_* to avoid collision with memgraph_data / qdrant_data

name: signoz

networks:
  incimin:

services:
  ingester:
    container_name: signoz-ingester
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    deploy:
      replicas: 1
    entrypoint:
      - /bin/sh
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    # v0.144.7: foundryctl :latest resolves here; has /signoz-otel-collector migrate subcommands
    # 0.55.x series does NOT have migrate subcommands and cannot run the migrator command
    image: signoz/signoz-otel-collector:v0.144.7
    networks:
      incimin:
        aliases:
          - signoz-ingester
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped
    volumes:
      - ./signoz/pours/deployment/ingester/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./signoz/pours/deployment/ingester/opamp.yaml:/etc/opamp-config.yaml:ro
    depends_on:
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully

  signoz-metastore-postgres-0:
    container_name: signoz-metastore-postgres-0
    environment:
      - POSTGRES_DB=signoz
      - POSTGRES_PASSWORD=signoz
      - POSTGRES_USER=signoz
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U signoz -d signoz
      timeout: 10s
    image: postgres:16
    networks:
      - incimin
    restart: unless-stopped
    volumes:
      - signoz_metastore_postgres_data:/var/lib/postgresql/data

  signoz-signoz-0:
    container_name: signoz-signoz-0
    environment:
      - SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://signoz:signoz@signoz-metastore-postgres-0:5432/signoz?sslmode=disable
      - SIGNOZ_SQLSTORE_PROVIDER=postgres
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8080/api/v1/health
      timeout: 10s
    image: signoz/signoz:v0.135.1
    networks:
      - incimin
    ports:
      # D-04: UI bound to 3301, never 8080 — see docs/PORTS.md
      - "127.0.0.1:3301:8080"
    restart: unless-stopped
    depends_on:
      signoz-metastore-postgres-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy

  signoz-telemetrykeeper-clickhousekeeper-0:
    container_name: signoz-telemetrykeeper-clickhousekeeper-0
    entrypoint:
      - /usr/bin/clickhouse-keeper
      - --config-file=/etc/clickhouse-keeper/keeper.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
        - CMD
        - clickhouse-keeper-client
        - -h
        - localhost
        - -p
        - "9181"
        - -q
        - ls
      timeout: 10s
    # Pinned to 24.1.2.5 to match clickhouse-server version (D-08)
    image: clickhouse/clickhouse-keeper:24.8.14.39
    networks:
      - incimin
    restart: unless-stopped
    volumes:
      - signoz_telemetrykeeper_data:/var/lib/clickhouse-keeper
      - ./signoz/pours/deployment/telemetrykeeper/clickhousekeeper/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro

  signoz-telemetrystore-clickhouse-0-0:
    container_name: signoz-telemetrystore-clickhouse-0-0
    depends_on:
      signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLICKHOUSE_CONFIG=/etc/clickhouse-server/config-0-0.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8123/ping
      timeout: 10s
    # D-08: pinned to SigNoz-validated version; 24.3+ is untested per SigNoz charts warning
    image: clickhouse/clickhouse-server:24.8.14.39
    networks:
      - incimin
    ports:
      # T-01-08: HTTP bound to loopback only; TCP 9000 not published (agent uses HTTP)
      - "127.0.0.1:8123:8123"
    restart: unless-stopped
    volumes:
      - signoz_telemetrystore_clickhouse_data:/var/lib/clickhouse
      - signoz_telemetrystore_user_scripts:/var/lib/clickhouse/user_scripts:ro
      - ./signoz/pours/deployment/telemetrystore/clickhouse/config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
      - ./signoz/pours/deployment/telemetrystore/clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro

  signoz-telemetrystore-clickhouse-user-scripts:
    command:
      - bash
      - -c
      - |-
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    container_name: signoz-telemetrystore-clickhouse-user-scripts
    image: clickhouse/clickhouse-server:24.8.14.39
    networks:
      - incimin
    restart: on-failure
    volumes:
      - signoz_telemetrystore_user_scripts:/var/lib/clickhouse/user_scripts

  signoz-telemetrystore-migrator:
    command:
      - -c
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    container_name: signoz-telemetrystore-migrator
    entrypoint:
      - /bin/sh
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    # v0.144.7 matches ingester; migrate subcommands available in this version
    image: signoz/signoz-otel-collector:v0.144.7
    networks:
      - incimin
    restart: on-failure
    depends_on:
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy

volumes:
  signoz_metastore_postgres_data:
    name: signoz_metastore_postgres_data
  signoz_telemetrykeeper_data:
    name: signoz_telemetrykeeper_data
  signoz_telemetrystore_clickhouse_data:
    name: signoz_telemetrystore_clickhouse_data
  signoz_telemetrystore_user_scripts:
    name: signoz_telemetrystore_user_scripts
